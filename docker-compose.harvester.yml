# Harvester/worker box compose — run ONLY on the worker server (8 GB box).
# Paste into Coolify → "Docker Compose Empty", then set the secrets in Coolify's
# Environment Variables (DATABASE_URL, MINIO_*, CRON_SECRET, RESEND_*, etc.).
#
# Postgres / MinIO / the public app live on the MAIN box — never here.
# `${VAR:-default}` knobs are pre-tuned; you only MUST set the bare `${VAR}` secrets.

services:
  harvester:
    image: ghcr.io/felixkwasisarpong/hireoven-harvester:latest
    pull_policy: always
    container_name: hireoven-harvester
    restart: unless-stopped
    # Pin the worker command so Coolify can't substitute a Next start. This is the
    # background harvester loop — it must NOT run a web server.
    command: ["npm", "run", "harvester:worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: ${PGSSLMODE:-disable}
      PG_POOL_MAX: ${PG_POOL_MAX:-25}
      HARVESTER_USE_NEW_ADAPTERS: ${HARVESTER_USE_NEW_ADAPTERS:-true}
      # Workable has its own paced worker below. Excluding it here keeps 429
      # backoff and queued Workable detail fetches from consuming the main ATS
      # worker capacity.
      HARVESTER_EXCLUDE_ADAPTERS: ${HARVESTER_EXCLUDE_ADAPTERS:-workable}
      HARVESTER_INSTANCES: ${HARVESTER_INSTANCES:-6}
      # Total claims are divided across HARVESTER_INSTANCES in worker.ts.
      # Without this, 6 loops silently fall back to 24 total claims/tick.
      HARVESTER_TOTAL_CLAIM_BUDGET: ${HARVESTER_TOTAL_CLAIM_BUDGET:-60}
      HARVESTER_CONCURRENCY: ${HARVESTER_CONCURRENCY:-12}
      HARVESTER_CLAIM_BATCH_SIZE: ${HARVESTER_CLAIM_BATCH_SIZE:-40}
      HARVESTER_TICK_INTERVAL_MS: ${HARVESTER_TICK_INTERVAL_MS:-15000}
      HARVESTER_LEASE_SECONDS: ${HARVESTER_LEASE_SECONDS:-600}
      HARVESTER_TIER_1_INTERVAL_SEC: ${HARVESTER_TIER_1_INTERVAL_SEC:-180}
      HARVESTER_TIER_2_INTERVAL_SEC: ${HARVESTER_TIER_2_INTERVAL_SEC:-3600}
      HARVESTER_FAILURE_COOLDOWN_SECONDS: ${HARVESTER_FAILURE_COOLDOWN_SECONDS:-1800}
      HARVESTER_RATE_LIMIT_COOLDOWN_SECONDS: ${HARVESTER_RATE_LIMIT_COOLDOWN_SECONDS:-900}
      HARVESTER_HTTP_403_COOLDOWN_SECONDS: ${HARVESTER_HTTP_403_COOLDOWN_SECONDS:-86400}
      HARVESTER_PER_COMPANY_TIMEOUT_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_MS:-60000}
      HARVESTER_PER_COMPANY_TIMEOUT_WORKDAY_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_WORKDAY_MS:-120000}
      HARVESTER_PER_COMPANY_TIMEOUT_SMARTRECRUITERS_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_SMARTRECRUITERS_MS:-90000}
      HARVESTER_PER_COMPANY_TIMEOUT_ASHBY_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_ASHBY_MS:-90000}
      HARVESTER_PER_COMPANY_TIMEOUT_USAJOBS_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_USAJOBS_MS:-90000}
      HARVESTER_PER_COMPANY_TIMEOUT_ICIMS_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_ICIMS_MS:-90000}
      HARVESTER_PER_COMPANY_TIMEOUT_APPLE_MS: ${HARVESTER_PER_COMPANY_TIMEOUT_APPLE_MS:-280000}
      # Apple is Playwright-rendered; MAX_PAGES drives how deep into its (large) board
      # we go per crawl. Keep it paired with the APPLE per-company timeout above.
      HARVESTER_APPLE_MAX_PAGES: ${HARVESTER_APPLE_MAX_PAGES:-100}
      HARVESTER_WORKDAY_REQUEST_TIMEOUT_MS: ${HARVESTER_WORKDAY_REQUEST_TIMEOUT_MS:-20000}
      HARVESTER_SMARTRECRUITERS_REQUEST_TIMEOUT_MS: ${HARVESTER_SMARTRECRUITERS_REQUEST_TIMEOUT_MS:-12000}
      HARVESTER_ASHBY_REQUEST_TIMEOUT_MS: ${HARVESTER_ASHBY_REQUEST_TIMEOUT_MS:-12000}
      HARVESTER_USAJOBS_REQUEST_TIMEOUT_MS: ${HARVESTER_USAJOBS_REQUEST_TIMEOUT_MS:-20000}
      HARVESTER_ICIMS_REQUEST_TIMEOUT_MS: ${HARVESTER_ICIMS_REQUEST_TIMEOUT_MS:-15000}
      HARVESTER_ASHBY_CONCURRENCY: ${HARVESTER_ASHBY_CONCURRENCY:-2}
      HARVESTER_GREENHOUSE_CONCURRENCY: ${HARVESTER_GREENHOUSE_CONCURRENCY:-3}
      HARVESTER_LEVER_CONCURRENCY: ${HARVESTER_LEVER_CONCURRENCY:-2}
      # apply.workable.com publishes a hard 10 requests / 10 seconds limit. Keep
      # one Workable lane and let ATS_RATE_LIMIT_WORKABLE_* pace listing + detail
      # requests; raising concurrency alone only fills the limiter queue.
      HARVESTER_WORKABLE_CONCURRENCY: ${HARVESTER_WORKABLE_CONCURRENCY:-1}
      # Detail-pass volume — Workable v3 omits the JD from the list, so the pass
      # fetches /api/v2 per new job. The shared Workable token bucket enforces
      # the 1 rps average; this cap controls how much detail work one board can
      # consume before the next company gets a turn.
      HARVESTER_WORKABLE_DETAIL_MAX_JOBS: ${HARVESTER_WORKABLE_DETAIL_MAX_JOBS:-20}
      HARVESTER_WORKABLE_DETAIL_DELAY_MS: ${HARVESTER_WORKABLE_DETAIL_DELAY_MS:-0}
      # Route adapter fetches whose host matches HARVESTER_PROXY_HOSTS through a
      # proxy. Default is Workday only (its per-tenant rate is low enough for one
      # proxy IP). Keep high-volume ATS hosts direct unless you have a legitimate
      # proxy route and still keep their ATS_RATE_LIMIT_* caps in place.
      HARVESTER_PROXY_URL: ${HARVESTER_PROXY_URL:-}
      HARVESTER_PROXY_HOSTS: ${HARVESTER_PROXY_HOSTS:-myworkdayjobs.com}
      HARVESTER_TEAMTAILOR_CONCURRENCY: ${HARVESTER_TEAMTAILOR_CONCURRENCY:-1}
      HARVESTER_RECRUITEE_CONCURRENCY: ${HARVESTER_RECRUITEE_CONCURRENCY:-2}
      HARVESTER_SMARTRECRUITERS_CONCURRENCY: ${HARVESTER_SMARTRECRUITERS_CONCURRENCY:-1}
      HARVESTER_ICIMS_CONCURRENCY: ${HARVESTER_ICIMS_CONCURRENCY:-1}
      HARVESTER_BAMBOOHR_CONCURRENCY: ${HARVESTER_BAMBOOHR_CONCURRENCY:-1}
      HARVESTER_JAZZHR_CONCURRENCY: ${HARVESTER_JAZZHR_CONCURRENCY:-1}
      HARVESTER_PERSONIO_CONCURRENCY: ${HARVESTER_PERSONIO_CONCURRENCY:-1}
      HARVESTER_RIPPLING_CONCURRENCY: ${HARVESTER_RIPPLING_CONCURRENCY:-1}
      HARVESTER_JOBVITE_CONCURRENCY: ${HARVESTER_JOBVITE_CONCURRENCY:-1}
      HARVESTER_ORACLECLOUD_CONCURRENCY: ${HARVESTER_ORACLECLOUD_CONCURRENCY:-1}
      HARVESTER_APPLE_CONCURRENCY: ${HARVESTER_APPLE_CONCURRENCY:-1}
      # Shared ATS HTTP token buckets. Code defaults cover every known host; the
      # envs below expose the high-volume ones for production tuning.
      ATS_RATE_LIMIT_QUEUE_CAP: ${ATS_RATE_LIMIT_QUEUE_CAP:-200}
      ATS_RATE_LIMIT_WORKABLE_RPS: ${ATS_RATE_LIMIT_WORKABLE_RPS:-1}
      ATS_RATE_LIMIT_WORKABLE_BURST: ${ATS_RATE_LIMIT_WORKABLE_BURST:-10}
      ATS_RATE_LIMIT_GREENHOUSE_RPS: ${ATS_RATE_LIMIT_GREENHOUSE_RPS:-3}
      ATS_RATE_LIMIT_GREENHOUSE_BURST: ${ATS_RATE_LIMIT_GREENHOUSE_BURST:-10}
      ATS_RATE_LIMIT_LEVER_RPS: ${ATS_RATE_LIMIT_LEVER_RPS:-5}
      ATS_RATE_LIMIT_LEVER_BURST: ${ATS_RATE_LIMIT_LEVER_BURST:-10}
      ATS_RATE_LIMIT_SMARTRECRUITERS_RPS: ${ATS_RATE_LIMIT_SMARTRECRUITERS_RPS:-5}
      ATS_RATE_LIMIT_SMARTRECRUITERS_BURST: ${ATS_RATE_LIMIT_SMARTRECRUITERS_BURST:-8}
      ATS_RATE_LIMIT_WORKDAY_RPS: ${ATS_RATE_LIMIT_WORKDAY_RPS:-2}
      ATS_RATE_LIMIT_WORKDAY_BURST: ${ATS_RATE_LIMIT_WORKDAY_BURST:-5}
      ATS_RATE_LIMIT_ICIMS_RPS: ${ATS_RATE_LIMIT_ICIMS_RPS:-1}
      ATS_RATE_LIMIT_ICIMS_BURST: ${ATS_RATE_LIMIT_ICIMS_BURST:-5}
      ATS_RATE_LIMIT_BAMBOOHR_RPS: ${ATS_RATE_LIMIT_BAMBOOHR_RPS:-2}
      ATS_RATE_LIMIT_BAMBOOHR_BURST: ${ATS_RATE_LIMIT_BAMBOOHR_BURST:-5}
      ATS_RATE_LIMIT_PERSONIO_RPS: ${ATS_RATE_LIMIT_PERSONIO_RPS:-2}
      ATS_RATE_LIMIT_PERSONIO_BURST: ${ATS_RATE_LIMIT_PERSONIO_BURST:-5}
      USAJOBS_API_KEY: ${USAJOBS_API_KEY}
      USAJOBS_USER_AGENT: ${USAJOBS_USER_AGENT}

  harvester-workable:
    image: ghcr.io/felixkwasisarpong/hireoven-harvester:latest
    pull_policy: always
    container_name: hireoven-harvester-workable
    restart: unless-stopped
    command: ["npm", "run", "harvester:worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: ${PGSSLMODE:-disable}
      PG_POOL_MAX: ${HARVESTER_WORKABLE_PG_POOL_MAX:-5}
      HARVESTER_USE_NEW_ADAPTERS: ${HARVESTER_USE_NEW_ADAPTERS:-true}
      HARVESTER_INCLUDE_ADAPTERS: workable
      HARVESTER_INSTANCES: ${HARVESTER_WORKABLE_INSTANCES:-1}
      HARVESTER_TOTAL_CLAIM_BUDGET: ${HARVESTER_WORKABLE_TOTAL_CLAIM_BUDGET:-1}
      HARVESTER_CONCURRENCY: ${HARVESTER_WORKABLE_DEFAULT_CONCURRENCY:-1}
      HARVESTER_CLAIM_BATCH_SIZE: ${HARVESTER_WORKABLE_CLAIM_BATCH_SIZE:-1}
      HARVESTER_TICK_INTERVAL_MS: ${HARVESTER_WORKABLE_TICK_INTERVAL_MS:-1000}
      HARVESTER_LEASE_SECONDS: ${HARVESTER_WORKABLE_LEASE_SECONDS:-600}
      HARVESTER_TICK_TIMEOUT_MS: ${HARVESTER_WORKABLE_TICK_TIMEOUT_MS:-300000}
      HARVESTER_PER_COMPANY_TIMEOUT_MS: ${HARVESTER_WORKABLE_PER_COMPANY_TIMEOUT_MS:-180000}
      HARVESTER_WORKABLE_CONCURRENCY: ${HARVESTER_WORKABLE_CONCURRENCY:-1}
      HARVESTER_WORKABLE_DETAIL_MAX_JOBS: ${HARVESTER_WORKABLE_DETAIL_MAX_JOBS:-20}
      HARVESTER_WORKABLE_DETAIL_DELAY_MS: ${HARVESTER_WORKABLE_DETAIL_DELAY_MS:-0}
      ATS_RATE_LIMIT_WORKABLE_RPS: ${ATS_RATE_LIMIT_WORKABLE_RPS:-1}
      ATS_RATE_LIMIT_WORKABLE_BURST: ${ATS_RATE_LIMIT_WORKABLE_BURST:-10}
      ATS_RATE_LIMIT_QUEUE_CAP: ${ATS_RATE_LIMIT_QUEUE_CAP:-200}
      HARVESTER_FAILURE_COOLDOWN_SECONDS: ${HARVESTER_FAILURE_COOLDOWN_SECONDS:-1800}
      HARVESTER_RATE_LIMIT_COOLDOWN_SECONDS: ${HARVESTER_RATE_LIMIT_COOLDOWN_SECONDS:-900}
      HARVESTER_HTTP_403_COOLDOWN_SECONDS: ${HARVESTER_HTTP_403_COOLDOWN_SECONDS:-86400}
      HARVESTER_PROXY_URL: ${HARVESTER_PROXY_URL:-}
      HARVESTER_PROXY_HOSTS: ${HARVESTER_PROXY_HOSTS:-myworkdayjobs.com}

  app-worker:
    image: ghcr.io/felixkwasisarpong/hireoven:latest
    pull_policy: always
    container_name: hireoven-app-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: ${PGSSLMODE:-disable}
      # MinIO lives on the MAIN box:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-hireoven-resumes}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      # Discovery pipeline — all optional (code defaults apply when unset).
      # FEED_USE_NEW_STATUS must be passed through for the Phase-5 feed flip.
      FEED_USE_NEW_STATUS: ${FEED_USE_NEW_STATUS:-false}
      # Routes Dice fetches through a residential/clean-IP proxy (Dice WAF-blocks
      # datacenter IPs). e.g. http://5.161.53.248:8888 (tinyproxy on the webbox).
      DICE_PROXY_URL: ${DICE_PROXY_URL:-}
      # Routes harvesterFetch (ATS board probes, builtin/glassdoor/WaaS workers,
      # careers + domain discovery probes) through a proxy for hosts matching
      # HARVESTER_PROXY_HOSTS. Leave HARVESTER_PROXY_URL unset for direct fetch.
      # WARNING: keep the host list targeted to known-WAF hosts — funnelling
      # high-volume ATS hosts (greenhouse/lever) through one proxy IP will get
      # that IP blocked. Default proxies Workday only.
      HARVESTER_PROXY_URL: ${HARVESTER_PROXY_URL:-}
      HARVESTER_PROXY_HOSTS: ${HARVESTER_PROXY_HOSTS:-myworkdayjobs.com}
      # Pages Jooble walks per query (was single-page; raise if quota allows).
      JOOBLE_PAGES_PER_QUERY: ${JOOBLE_PAGES_PER_QUERY:-3}
      AGGREGATOR_BACKSOLVE_CONCURRENCY: ${AGGREGATOR_BACKSOLVE_CONCURRENCY:-4}
      AGGREGATOR_BACKSOLVE_BUDGET_MS: ${AGGREGATOR_BACKSOLVE_BUDGET_MS:-150000}
      ATS_RESOLVE_TIMEOUT_MS: ${ATS_RESOLVE_TIMEOUT_MS:-10000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      USAJOBS_API_KEY: ${USAJOBS_API_KEY}
      USAJOBS_USER_AGENT: ${USAJOBS_USER_AGENT}
      # Aggregator ingest crons — set only the ones you run:
      THE_MUSE_API_KEY: ${THE_MUSE_API_KEY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      CAREERJET_AFFILIATE_ID: ${CAREERJET_AFFILIATE_ID:-}
      CAREERJET_AFFID: ${CAREERJET_AFFID:-}
      CAREERJET_REFERER: ${CAREERJET_REFERER:-}
      CAREERJET_USER_IP: ${CAREERJET_USER_IP:-}
      CAREERJET_SEARCH_QUERIES: ${CAREERJET_SEARCH_QUERIES:-}
      CAREERJET_COUNTRIES: ${CAREERJET_COUNTRIES:-}
      CAREERJET_MAX_JOBS: ${CAREERJET_MAX_JOBS:-}
      CAREERJET_MAX_PAGES: ${CAREERJET_MAX_PAGES:-}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      DICE_API_KEY: ${DICE_API_KEY:-}
      # Company discovery: name -> guessed_domain (stage 0) -> ATS (stage 1).
      DISCOVER_FROM_DOMAINS_ENABLED: ${DISCOVER_FROM_DOMAINS_ENABLED:-false}
      DISCOVER_FROM_DOMAINS_BATCH: ${DISCOVER_FROM_DOMAINS_BATCH:-}
      DISCOVER_FROM_DOMAINS_CONCURRENCY: ${DISCOVER_FROM_DOMAINS_CONCURRENCY:-}
      DISCOVER_FROM_DOMAINS_RESOLVE_BATCH: ${DISCOVER_FROM_DOMAINS_RESOLVE_BATCH:-}
      DISCOVER_FROM_DOMAINS_RESOLVE_CONCURRENCY: ${DISCOVER_FROM_DOMAINS_RESOLVE_CONCURRENCY:-}
      DISCOVER_FROM_DOMAINS_RESOLVE_RETRY_HOURS: ${DISCOVER_FROM_DOMAINS_RESOLVE_RETRY_HOURS:-}
      DISCOVER_FROM_DOMAINS_ENABLE_CLEARBIT: ${DISCOVER_FROM_DOMAINS_ENABLE_CLEARBIT:-false}
      DISCOVER_FROM_DOMAINS_PROMOTE_CUSTOM: ${DISCOVER_FROM_DOMAINS_PROMOTE_CUSTOM:-true}
      DISCOVER_FROM_DOMAINS_CUSTOM_MIN_CONFIDENCE: ${DISCOVER_FROM_DOMAINS_CUSTOM_MIN_CONFIDENCE:-medium}
      # Disabled by default; the cron route returns a cheap no-op unless enabled.
      GLASSDOOR_DISCOVERY_ENABLED: ${GLASSDOOR_DISCOVERY_ENABLED:-false}
      GLASSDOOR_DISCOVERY_CONFIG: ${GLASSDOOR_DISCOVERY_CONFIG:-scripts/config/glassdoor-discovery.json}
      GLASSDOOR_MAX_REQUESTS_PER_RUN: ${GLASSDOOR_MAX_REQUESTS_PER_RUN:-8}
      GLASSDOOR_MAX_REQUESTS_PER_MINUTE: ${GLASSDOOR_MAX_REQUESTS_PER_MINUTE:-6}
      GLASSDOOR_DAILY_REQUEST_BUDGET: ${GLASSDOOR_DAILY_REQUEST_BUDGET:-40}
      GLASSDOOR_MIN_DELAY_MS: ${GLASSDOOR_MIN_DELAY_MS:-4000}
      GLASSDOOR_MAX_DELAY_MS: ${GLASSDOOR_MAX_DELAY_MS:-12000}
      # Crawler (Playwright OFF — the app image has no browser; HTTP-only crawl):
      CRAWLER_PLAYWRIGHT_ENABLED: ${CRAWLER_PLAYWRIGHT_ENABLED:-false}
      CRAWLER_MAX_COMPANIES_PER_RUN: ${CRAWLER_MAX_COMPANIES_PER_RUN:-150}
      CRAWLER_COMPANY_CONCURRENCY: ${CRAWLER_COMPANY_CONCURRENCY:-15}
      CRAWLER_DOMAIN_CONCURRENCY: ${CRAWLER_DOMAIN_CONCURRENCY:-6}
      CRAWLER_FETCH_TIMEOUT_MS: ${CRAWLER_FETCH_TIMEOUT_MS:-6000}
      JOB_DESCRIPTION_ENRICHMENT_BATCH_SIZE: ${JOB_DESCRIPTION_ENRICHMENT_BATCH_SIZE:-500}
      JOB_DESCRIPTION_ENRICHMENT_CONCURRENCY: ${JOB_DESCRIPTION_ENRICHMENT_CONCURRENCY:-12}
    # Loopback only — the host crontab reaches it at http://localhost:3100,
    # never the internet.
    ports:
      - "127.0.0.1:${WORKER_PORT:-3100}:3000"
