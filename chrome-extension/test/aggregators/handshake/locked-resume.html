<!DOCTYPE html>
<html>
<body>
  <main>
    <h1 data-hook="job-title">Operations Analyst Intern</h1>
    <div data-hook="employer-name"><a>SchoolLockedCo</a></div>
    <div data-hook="location">Remote</div>
    <div data-hook="job-description">
      Operations internship for current undergrads.
    </div>
    <button>Apply</button>
  </main>
  <div data-hook="application-modal">
    <input type="file" disabled aria-disabled="true" name="resume" id="resume-input" />
    <label for="resume-input">Resume (locked by school profile)</label>
    <button>Continue</button>
  </div>
</body>
</html>
