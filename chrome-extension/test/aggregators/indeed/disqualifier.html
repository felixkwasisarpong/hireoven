<!DOCTYPE html>
<html>
<body>
  <div class="jobsearch-RightPane">
    <h1 class="jobsearch-JobInfoHeader-title">Principal Engineer</h1>
    <div class="jobsearch-CompanyInfoContainer"><a>Strict Inc</a></div>
    <div data-testid="inlineHeader-companyLocation">Boston, MA</div>
    <div id="jobDescriptionText">Requires 10+ years and US citizenship.</div>
    <div class="jobsearch-JobMetadataFooter">Posted 1 day ago</div>
    <button data-testid="indeedApplyButton">Apply now</button>
  </div>

  <div data-testid="IndeedApply-Modal">
    <div class="ia-Questions-item">
      <label>Are you a US Citizen?</label>
      <input type="radio" id="dq-yes" name="dq-citizen" value="yes" />
      <label for="dq-yes">Yes</label>
      <input type="radio" id="dq-no" name="dq-citizen" value="no" />
      <label for="dq-no">No</label>
    </div>
    <button>Continue</button>
  </div>
</body>
</html>
