services:
  postgres:
    image: postgres:17-alpine
    container_name: hireoven-postgres
    restart: unless-stopped
    shm_size: "${POSTGRES_SHM_SIZE:-1gb}"
    # Performance tuning. Defaults target a ~16 GB box; override via .env for a
    # different size (e.g. an 8 GB box: SHARED_BUFFERS=2GB, EFFECTIVE_CACHE_SIZE=6GB;
    # a 4 GB box: 1GB / 3GB). Without this, Postgres uses shared_buffers=128MB and
    # caches almost nothing → low cache-hit ratio and disk-bound queries.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-4GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-12GB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-32MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireoven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hireoven}
    volumes:
      - hireoven_postgres_data:/var/lib/postgresql/data
      - ./lib/postgres/auth-bootstrap.sql:/docker-entrypoint-initdb.d/01-auth-bootstrap.sql:ro
      - ./docker/postgres/02-profiles.sql:/docker-entrypoint-initdb.d/02-profiles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireoven} -d ${POSTGRES_DB:-hireoven}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Remove this port mapping after the initial data restore
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  minio:
    image: minio/minio:latest
    container_name: hireoven-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - hireoven_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    # 9001 = MinIO console (web UI) — remove after setup if you don't need it
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:latest
    container_name: hireoven-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-hireoven-resumes}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      /usr/bin/mc mb -p local/$$MINIO_BUCKET || true &&
      /usr/bin/mc anonymous set none local/$$MINIO_BUCKET || true
      "

  app:
    # Pre-built by GitHub Actions — Coolify just pulls, no build on server
    image: ghcr.io/felixkwasisarpong/hireoven:latest
    pull_policy: always
    container_name: hireoven-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-hireoven}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireoven}
      PGSSLMODE: disable
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-hireoven-resumes}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN}
      NEXT_PUBLIC_LOGO_DEV_TOKEN: ${NEXT_PUBLIC_LOGO_DEV_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      WAITLIST_ONLY: ${WAITLIST_ONLY:-true}
      CRON_SECRET: ${CRON_SECRET}
      # Discovery pipeline — all optional (code defaults apply when unset).
      # FEED_USE_NEW_STATUS must be passed through here for the Phase-5 feed flip
      # to take effect (explicit env allowlist; Coolify alone is not enough).
      FEED_USE_NEW_STATUS: ${FEED_USE_NEW_STATUS:-false}
      # Routes Dice fetches through a residential/clean-IP proxy (Dice WAF-blocks
      # datacenter IPs). e.g. http://5.161.53.248:8888 (tinyproxy on the webbox).
      DICE_PROXY_URL: ${DICE_PROXY_URL:-}
      # Routes harvesterFetch (ATS board probes, builtin/glassdoor/WaaS workers,
      # careers + domain discovery probes) through a proxy for hosts matching
      # HARVESTER_PROXY_HOSTS. Leave HARVESTER_PROXY_URL unset for direct fetch.
      # WARNING: keep the host list targeted to known-WAF hosts — funnelling
      # high-volume ATS hosts (greenhouse/lever) through one proxy IP will get
      # that IP blocked. Default proxies Workday only.
      HARVESTER_PROXY_URL: ${HARVESTER_PROXY_URL:-}
      HARVESTER_PROXY_HOSTS: ${HARVESTER_PROXY_HOSTS:-myworkdayjobs.com}
      # Proactive per-host rate cap for harvesterFetch (crons, legacy crawler,
      # discovery, aggregator backsolve). Without this the worker hammered
      # shared hosts uncapped — apply.workable.com 429'd and burned ~14 worker-
      # hrs/day on 77s timeouts. Divided by HARVESTER_INSTANCES at runtime.
      HARVESTER_HOST_RATE_LIMITS: ${HARVESTER_HOST_RATE_LIMITS:-boards-api.greenhouse.io=18,api.lever.co=30,api.smartrecruiters.com=30,api.ashbyhq.com=18,teamtailor.com=30,recruitee.com=60,applytojob.com=24,apply.workable.com=6,myworkdayjobs.com=12,icims.com=6,bamboohr.com=12,jobs.personio.com=12,jobs.personio.de=12,jobs.jobvite.com=12,successfactors.com=6,taleo.net=6,avature.net=6}
      # Pages Jooble walks per query (was single-page; raise if quota allows).
      JOOBLE_PAGES_PER_QUERY: ${JOOBLE_PAGES_PER_QUERY:-3}
      AGGREGATOR_BACKSOLVE_CONCURRENCY: ${AGGREGATOR_BACKSOLVE_CONCURRENCY:-4}
      AGGREGATOR_BACKSOLVE_BUDGET_MS: ${AGGREGATOR_BACKSOLVE_BUDGET_MS:-150000}
      ATS_RESOLVE_TIMEOUT_MS: ${ATS_RESOLVE_TIMEOUT_MS:-10000}
      # Careerjet ingest (careerjet-ingest cron runs here via Coolify)
      CAREERJET_AFFILIATE_ID: ${CAREERJET_AFFILIATE_ID}
      CAREERJET_AFFID: ${CAREERJET_AFFID}
      CAREERJET_REFERER: ${CAREERJET_REFERER}
      CAREERJET_USER_IP: ${CAREERJET_USER_IP}
      CAREERJET_SEARCH_QUERIES: ${CAREERJET_SEARCH_QUERIES}
      CAREERJET_COUNTRIES: ${CAREERJET_COUNTRIES}
      CAREERJET_MAX_JOBS: ${CAREERJET_MAX_JOBS}
      CAREERJET_MAX_PAGES: ${CAREERJET_MAX_PAGES}
      # Company discovery: name -> guessed_domain (stage 0) -> ATS (stage 1).
      # All off unless set in .env, so adding these passthroughs is inert.
      DISCOVER_FROM_DOMAINS_ENABLED: ${DISCOVER_FROM_DOMAINS_ENABLED}
      DISCOVER_FROM_DOMAINS_BATCH: ${DISCOVER_FROM_DOMAINS_BATCH}
      DISCOVER_FROM_DOMAINS_CONCURRENCY: ${DISCOVER_FROM_DOMAINS_CONCURRENCY}
      DISCOVER_FROM_DOMAINS_RESOLVE_BATCH: ${DISCOVER_FROM_DOMAINS_RESOLVE_BATCH}
      DISCOVER_FROM_DOMAINS_RESOLVE_CONCURRENCY: ${DISCOVER_FROM_DOMAINS_RESOLVE_CONCURRENCY}
      DISCOVER_FROM_DOMAINS_ENABLE_CLEARBIT: ${DISCOVER_FROM_DOMAINS_ENABLE_CLEARBIT}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY}
      STRIPE_PRICE_PRO_MAX_MONTHLY: ${STRIPE_PRICE_PRO_MAX_MONTHLY}
      STRIPE_PRICE_PRO_MAX_YEARLY: ${STRIPE_PRICE_PRO_MAX_YEARLY}
      STRIPE_PRICE_PRO_INTERNATIONAL_MONTHLY: ${STRIPE_PRICE_PRO_INTERNATIONAL_MONTHLY}
      STRIPE_STUDENT_PROMOTION_CODE_ID: ${STRIPE_STUDENT_PROMOTION_CODE_ID}
      # Crawler
      CRAWLER_PLAYWRIGHT_ENABLED: ${CRAWLER_PLAYWRIGHT_ENABLED:-false}
      CRAWLER_MAX_COMPANIES_PER_RUN: ${CRAWLER_MAX_COMPANIES_PER_RUN:-150}
      CRAWLER_COMPANY_CONCURRENCY: ${CRAWLER_COMPANY_CONCURRENCY:-15}
      CRAWLER_DOMAIN_CONCURRENCY: ${CRAWLER_DOMAIN_CONCURRENCY:-6}
      CRAWLER_FETCH_TIMEOUT_MS: ${CRAWLER_FETCH_TIMEOUT_MS:-6000}
      CRAWLER_FAILURE_STREAK_MIN: ${CRAWLER_FAILURE_STREAK_MIN:-3}
      CRAWLER_FAILURE_COOLDOWN_DAYS: ${CRAWLER_FAILURE_COOLDOWN_DAYS:-7}
      CRAWLER_BLOCKED_COOLDOWN_DAYS: ${CRAWLER_BLOCKED_COOLDOWN_DAYS:-14}
      CRAWLER_DOMAIN_BROKEN_COOLDOWN_DAYS: ${CRAWLER_DOMAIN_BROKEN_COOLDOWN_DAYS:-30}
      CRAWLER_BAD_URL_COOLDOWN_DAYS: ${CRAWLER_BAD_URL_COOLDOWN_DAYS:-30}
      CRAWLER_WORKDAY_FALLBACK_MAX_ATTEMPTS: ${CRAWLER_WORKDAY_FALLBACK_MAX_ATTEMPTS:-6}
      CRAWLER_MAX_DESCRIPTION_FETCHES_PER_COMPANY: ${CRAWLER_MAX_DESCRIPTION_FETCHES_PER_COMPANY:-0}
      CRAWLER_INCLUDE_BLOCKED_IN_MAIN: ${CRAWLER_INCLUDE_BLOCKED_IN_MAIN:-false}
      CRAWLER_INCLUDE_DOMAIN_BROKEN_IN_MAIN: ${CRAWLER_INCLUDE_DOMAIN_BROKEN_IN_MAIN:-false}
      CRAWLER_INCLUDE_LIKELY_INACTIVE_IN_MAIN: ${CRAWLER_INCLUDE_LIKELY_INACTIVE_IN_MAIN:-false}
    ports:
      - "${APP_PORT:-3000}:3000"

  # NOTE: there is intentionally NO `harvester` service in this web-box compose.
  # The harvester runs on its OWN dedicated server via docker-compose.harvester.yml.
  # It used to be defined here with no `profiles:` gate, so Coolify booted it right
  # next to the public app and pegged the CPU — crash-looping the web-box app
  # (incident 2026-06-17). Do not re-add it here.

  # ── Background worker (run on the HARVESTER box, not the web box) ──────────────
  # Same app image, NOT publicly exposed. It exists only so the harvester box's
  # crontab can hit cron endpoints LOCALLY (http://localhost:${WORKER_PORT:-3100})
  # instead of curling the public web app — so crawl/enrichment/ingest CPU+RAM
  # land here (8 GB box) and never touch the user-facing 4 GB web box.
  #
  # Enable only on the harvester box:  docker compose --profile worker up -d app-worker
  # On that box set DATABASE_URL (and MINIO_ENDPOINT) in .env to the web box host,
  # exactly like the harvester service already does.
  app-worker:
    image: ghcr.io/felixkwasisarpong/hireoven:latest
    pull_policy: always
    container_name: hireoven-app-worker
    restart: unless-stopped
    profiles: ["worker"]
    environment:
      NODE_ENV: production
      # Overridable so the remote (cross-region) DB host can be supplied on the
      # harvester box; falls back to the local compose Postgres otherwise.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hireoven}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireoven}}
      PGSSLMODE: disable
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-hireoven-resumes}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN}
      NEXT_PUBLIC_LOGO_DEV_TOKEN: ${NEXT_PUBLIC_LOGO_DEV_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      CRON_SECRET: ${CRON_SECRET}
      # Discovery pipeline — all optional (code defaults apply when unset).
      # FEED_USE_NEW_STATUS must be passed through here for the Phase-5 feed flip
      # to take effect (explicit env allowlist; Coolify alone is not enough).
      FEED_USE_NEW_STATUS: ${FEED_USE_NEW_STATUS:-false}
      # Routes Dice fetches through a residential/clean-IP proxy (Dice WAF-blocks
      # datacenter IPs). e.g. http://5.161.53.248:8888 (tinyproxy on the webbox).
      DICE_PROXY_URL: ${DICE_PROXY_URL:-}
      # Routes harvesterFetch (ATS board probes, builtin/glassdoor/WaaS workers,
      # careers + domain discovery probes) through a proxy for hosts matching
      # HARVESTER_PROXY_HOSTS. Leave HARVESTER_PROXY_URL unset for direct fetch.
      # WARNING: keep the host list targeted to known-WAF hosts — funnelling
      # high-volume ATS hosts (greenhouse/lever) through one proxy IP will get
      # that IP blocked. Default proxies Workday only.
      HARVESTER_PROXY_URL: ${HARVESTER_PROXY_URL:-}
      HARVESTER_PROXY_HOSTS: ${HARVESTER_PROXY_HOSTS:-myworkdayjobs.com}
      # Proactive per-host rate cap for harvesterFetch (crons, legacy crawler,
      # discovery, aggregator backsolve). Without this the worker hammered
      # shared hosts uncapped — apply.workable.com 429'd and burned ~14 worker-
      # hrs/day on 77s timeouts. Divided by HARVESTER_INSTANCES at runtime.
      HARVESTER_HOST_RATE_LIMITS: ${HARVESTER_HOST_RATE_LIMITS:-boards-api.greenhouse.io=18,api.lever.co=30,api.smartrecruiters.com=30,api.ashbyhq.com=18,teamtailor.com=30,recruitee.com=60,applytojob.com=24,apply.workable.com=6,myworkdayjobs.com=12,icims.com=6,bamboohr.com=12,jobs.personio.com=12,jobs.personio.de=12,jobs.jobvite.com=12,successfactors.com=6,taleo.net=6,avature.net=6}
      # Pages Jooble walks per query (was single-page; raise if quota allows).
      JOOBLE_PAGES_PER_QUERY: ${JOOBLE_PAGES_PER_QUERY:-3}
      AGGREGATOR_BACKSOLVE_CONCURRENCY: ${AGGREGATOR_BACKSOLVE_CONCURRENCY:-4}
      AGGREGATOR_BACKSOLVE_BUDGET_MS: ${AGGREGATOR_BACKSOLVE_BUDGET_MS:-150000}
      ATS_RESOLVE_TIMEOUT_MS: ${ATS_RESOLVE_TIMEOUT_MS:-10000}
      USAJOBS_API_KEY: ${USAJOBS_API_KEY}
      USAJOBS_USER_AGENT: ${USAJOBS_USER_AGENT}
      # Aggregator ingest crons — set only the ones you run:
      THE_MUSE_API_KEY: ${THE_MUSE_API_KEY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      CAREERJET_AFFILIATE_ID: ${CAREERJET_AFFILIATE_ID:-}
      CAREERJET_AFFID: ${CAREERJET_AFFID:-}
      CAREERJET_REFERER: ${CAREERJET_REFERER:-}
      CAREERJET_USER_IP: ${CAREERJET_USER_IP:-}
      CAREERJET_SEARCH_QUERIES: ${CAREERJET_SEARCH_QUERIES:-}
      CAREERJET_COUNTRIES: ${CAREERJET_COUNTRIES:-}
      CAREERJET_MAX_JOBS: ${CAREERJET_MAX_JOBS:-}
      CAREERJET_MAX_PAGES: ${CAREERJET_MAX_PAGES:-}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      DICE_API_KEY: ${DICE_API_KEY:-}
      # Company discovery: name -> guessed_domain (stage 0) -> ATS (stage 1).
      DISCOVER_FROM_DOMAINS_ENABLED: ${DISCOVER_FROM_DOMAINS_ENABLED:-false}
      DISCOVER_FROM_DOMAINS_BATCH: ${DISCOVER_FROM_DOMAINS_BATCH:-}
      DISCOVER_FROM_DOMAINS_CONCURRENCY: ${DISCOVER_FROM_DOMAINS_CONCURRENCY:-}
      DISCOVER_FROM_DOMAINS_RESOLVE_BATCH: ${DISCOVER_FROM_DOMAINS_RESOLVE_BATCH:-}
      DISCOVER_FROM_DOMAINS_RESOLVE_CONCURRENCY: ${DISCOVER_FROM_DOMAINS_RESOLVE_CONCURRENCY:-}
      DISCOVER_FROM_DOMAINS_RESOLVE_RETRY_HOURS: ${DISCOVER_FROM_DOMAINS_RESOLVE_RETRY_HOURS:-}
      DISCOVER_FROM_DOMAINS_ENABLE_CLEARBIT: ${DISCOVER_FROM_DOMAINS_ENABLE_CLEARBIT:-false}
      DISCOVER_FROM_DOMAINS_PROMOTE_CUSTOM: ${DISCOVER_FROM_DOMAINS_PROMOTE_CUSTOM:-true}
      DISCOVER_FROM_DOMAINS_CUSTOM_MIN_CONFIDENCE: ${DISCOVER_FROM_DOMAINS_CUSTOM_MIN_CONFIDENCE:-medium}
      # Disabled by default; the cron route returns a cheap no-op unless enabled.
      GLASSDOOR_DISCOVERY_ENABLED: ${GLASSDOOR_DISCOVERY_ENABLED:-false}
      GLASSDOOR_DISCOVERY_CONFIG: ${GLASSDOOR_DISCOVERY_CONFIG:-scripts/config/glassdoor-discovery.json}
      GLASSDOOR_MAX_REQUESTS_PER_RUN: ${GLASSDOOR_MAX_REQUESTS_PER_RUN:-8}
      GLASSDOOR_MAX_REQUESTS_PER_MINUTE: ${GLASSDOOR_MAX_REQUESTS_PER_MINUTE:-6}
      GLASSDOOR_DAILY_REQUEST_BUDGET: ${GLASSDOOR_DAILY_REQUEST_BUDGET:-40}
      GLASSDOOR_MIN_DELAY_MS: ${GLASSDOOR_MIN_DELAY_MS:-4000}
      GLASSDOOR_MAX_DELAY_MS: ${GLASSDOOR_MAX_DELAY_MS:-12000}
      # Crawler tuning (mirrors the app service)
      CRAWLER_PLAYWRIGHT_ENABLED: ${CRAWLER_PLAYWRIGHT_ENABLED:-false}
      CRAWLER_MAX_COMPANIES_PER_RUN: ${CRAWLER_MAX_COMPANIES_PER_RUN:-150}
      CRAWLER_COMPANY_CONCURRENCY: ${CRAWLER_COMPANY_CONCURRENCY:-15}
      CRAWLER_DOMAIN_CONCURRENCY: ${CRAWLER_DOMAIN_CONCURRENCY:-6}
      CRAWLER_FETCH_TIMEOUT_MS: ${CRAWLER_FETCH_TIMEOUT_MS:-6000}
      CRAWLER_FAILURE_STREAK_MIN: ${CRAWLER_FAILURE_STREAK_MIN:-3}
      CRAWLER_FAILURE_COOLDOWN_DAYS: ${CRAWLER_FAILURE_COOLDOWN_DAYS:-7}
      CRAWLER_BLOCKED_COOLDOWN_DAYS: ${CRAWLER_BLOCKED_COOLDOWN_DAYS:-14}
      CRAWLER_DOMAIN_BROKEN_COOLDOWN_DAYS: ${CRAWLER_DOMAIN_BROKEN_COOLDOWN_DAYS:-30}
      CRAWLER_BAD_URL_COOLDOWN_DAYS: ${CRAWLER_BAD_URL_COOLDOWN_DAYS:-30}
      CRAWLER_WORKDAY_FALLBACK_MAX_ATTEMPTS: ${CRAWLER_WORKDAY_FALLBACK_MAX_ATTEMPTS:-6}
      CRAWLER_MAX_DESCRIPTION_FETCHES_PER_COMPANY: ${CRAWLER_MAX_DESCRIPTION_FETCHES_PER_COMPANY:-0}
      CRAWLER_INCLUDE_BLOCKED_IN_MAIN: ${CRAWLER_INCLUDE_BLOCKED_IN_MAIN:-false}
      CRAWLER_INCLUDE_DOMAIN_BROKEN_IN_MAIN: ${CRAWLER_INCLUDE_DOMAIN_BROKEN_IN_MAIN:-false}
      CRAWLER_INCLUDE_LIKELY_INACTIVE_IN_MAIN: ${CRAWLER_INCLUDE_LIKELY_INACTIVE_IN_MAIN:-false}
      # Description enrichment tuning
      JOB_DESCRIPTION_ENRICHMENT_BATCH_SIZE: ${JOB_DESCRIPTION_ENRICHMENT_BATCH_SIZE:-500}
      JOB_DESCRIPTION_ENRICHMENT_CONCURRENCY: ${JOB_DESCRIPTION_ENRICHMENT_CONCURRENCY:-12}
    # Bind to loopback only — reachable from the host crontab, never the internet.
    ports:
      - "127.0.0.1:${WORKER_PORT:-3100}:3000"

volumes:
  hireoven_postgres_data:
  hireoven_minio_data:
