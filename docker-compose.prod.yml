# Web-box compose: public Next app + stateful services only.
# Do not run harvester, crawler crons, enrichment, or app-worker from this file.
# Those live in docker-compose.harvester.yml on the worker box so web repairs and
# worker repairs can happen independently.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hireoven-postgres
    restart: unless-stopped
    shm_size: "${POSTGRES_SHM_SIZE:-1gb}"
    # Performance tuning. Defaults target a ~16 GB box; override via .env for a
    # different size (e.g. an 8 GB box: SHARED_BUFFERS=2GB, EFFECTIVE_CACHE_SIZE=6GB;
    # a 4 GB box: 1GB / 3GB). Without this, Postgres uses shared_buffers=128MB and
    # caches almost nothing → low cache-hit ratio and disk-bound queries.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-4GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-12GB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-32MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireoven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hireoven}
    volumes:
      - hireoven_postgres_data:/var/lib/postgresql/data
      - ./lib/postgres/auth-bootstrap.sql:/docker-entrypoint-initdb.d/01-auth-bootstrap.sql:ro
      - ./docker/postgres/02-profiles.sql:/docker-entrypoint-initdb.d/02-profiles.sql:ro
    networks:
      # Stay on the Compose project network (what `default` resolves to) so the
      # existing app keeps reaching this as plain `postgres`.
      default: {}
      # Also join Coolify's own network, because that is the only destination
      # network Coolify offers a standalone application. Without this, an app
      # created outside this Compose stack cannot see this database at all.
      #
      # The alias is deliberately NOT `postgres`: on the coolify network that
      # name already resolves to `coolify-db`, Coolify's own control-plane
      # database (verified — it answers on 172.18.0.3). An app configured with
      # `postgres:5432` there would connect to Coolify's internals rather than
      # ours, so the alias is namespaced.
      coolify:
        aliases: [hireoven-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireoven} -d ${POSTGRES_DB:-hireoven}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Remove this port mapping after the initial data restore
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  minio:
    image: minio/minio:latest
    container_name: hireoven-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - hireoven_minio_data:/data
    networks:
      default: {}
      # Same reasoning as postgres above — reachable from a Coolify-managed app
      # outside this stack. Namespaced alias to avoid colliding with anything
      # Coolify runs on its own network.
      coolify:
        aliases: [hireoven-minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    # 9001 = MinIO console (web UI) — remove after setup if you don't need it
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:latest
    container_name: hireoven-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-hireoven-resumes}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      /usr/bin/mc mb -p local/$$MINIO_BUCKET || true &&
      /usr/bin/mc anonymous set none local/$$MINIO_BUCKET || true
      "

  app:
    # Pre-built by GitHub Actions — Coolify just pulls, no build on server
    image: ghcr.io/felixkwasisarpong/hireoven:${WEB_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: hireoven-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HIREOVEN_RUNTIME_ROLE: web
      DATABASE_URL: postgres://${POSTGRES_USER:-hireoven}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireoven}
      PGSSLMODE: disable
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-hireoven-resumes}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN}
      NEXT_PUBLIC_LOGO_DEV_TOKEN: ${NEXT_PUBLIC_LOGO_DEV_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      WAITLIST_ONLY: ${WAITLIST_ONLY:-true}
      # No CRON_SECRET is passed to the public web runtime. Scheduled jobs run
      # only on the harvester box's private app-worker.
      # Public feed flag — optional (code defaults apply when unset).
      # FEED_USE_NEW_STATUS must be passed through here for the Phase-5 feed flip
      # to take effect (explicit env allowlist; Coolify alone is not enough).
      FEED_USE_NEW_STATUS: ${FEED_USE_NEW_STATUS:-false}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY}
      STRIPE_PRICE_PRO_MAX_MONTHLY: ${STRIPE_PRICE_PRO_MAX_MONTHLY}
      STRIPE_PRICE_PRO_MAX_YEARLY: ${STRIPE_PRICE_PRO_MAX_YEARLY}
      STRIPE_PRICE_PRO_INTERNATIONAL_MONTHLY: ${STRIPE_PRICE_PRO_INTERNATIONAL_MONTHLY}
      STRIPE_STUDENT_PROMOTION_CODE_ID: ${STRIPE_STUDENT_PROMOTION_CODE_ID}
    # Bound to loopback, not 0.0.0.0. Traefik does not use this mapping — it
    # discovers the container through the Docker provider (traefik.enable=true
    # plus the Host(`hireoven.com`) router labels Coolify attaches) and connects
    # over the shared network, so publishing on all interfaces bought nothing and
    # served the app to the public internet over plain HTTP, TLS and proxy
    # bypassed. Verified before this change:
    #   curl http://5.161.53.248:3000/api/health  ->  200
    # Keep it on 127.0.0.1 for local debugging via an SSH tunnel:
    #   ssh -L 3000:127.0.0.1:3000 root@<web-box>
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # There is intentionally no `harvester` or `app-worker` service here. Use
  # docker-compose.harvester.yml on the worker box for ATS harvesting, Workable/
  # Workday crawls, enrichment, discovery, and every scheduled cron.

networks:
  # Created and owned by Coolify, so declared external — Compose must attach to
  # it, never create or destroy it. `default` stays implicit: Compose still makes
  # the per-project network, which is what the current app talks over.
  coolify:
    external: true

volumes:
  hireoven_postgres_data:
  hireoven_minio_data:
